name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-smoke-test:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify source text format
        shell: pwsh
        run: .\scripts\verify-text-format.ps1

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Restore locked dependencies
        run: dotnet restore .\GAssetForge.sln --locked-mode

      - name: Build Release
        run: dotnet build .\GAssetForge.sln -c Release --no-restore

      - name: Build and verify engineering entry
        shell: pwsh
        run: |
          .\scripts\build-engineering-entry.ps1 -Verify
          dotnet restore .\GAssetForge.sln --locked-mode

      - name: Run smoke suite
        run: dotnet run --project .\tests\GAssetForge.SmokeTests\GAssetForge.SmokeTests.csproj -c Release --no-build

      - name: Report vulnerable dependencies
        run: dotnet list "$env:GITHUB_WORKSPACE\GAssetForge.sln" package --vulnerable --include-transitive
