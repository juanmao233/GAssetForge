name: Bug report
description: Report a reproducible GAssetForge defect
title: "[Bug]: "
labels: [needs-triage]
body:
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Include the expected result and the actual result.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      placeholder: "1. Create a Tilemap project\n2. Open ...\n3. Click ..."
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: GAssetForge version or commit
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Remove tokens, private paths, prompts, and proprietary artwork before posting.
      render: text
